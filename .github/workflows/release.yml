name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      upload_url: ${{ steps.create.outputs.upload_url }}
    steps:
      - uses: softprops/action-gh-release@v2
        id: create
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

  # ---------------------------------------------------------------------
  # WINDOWS x86_64 — exe + NSIS installer + MSI
  # ---------------------------------------------------------------------
  build-windows-x64:
    needs: create-release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Sign Windows executable
        # Only runs when the signing certificate secret is present.
        # Store the PFX file as a base64 secret: WINDOWS_SIGNING_CERT
        # and the password as: WINDOWS_SIGNING_CERT_PASSWORD
        env:
          CERT_B64: ${{ secrets.WINDOWS_SIGNING_CERT }}
          CERT_PASS: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        if: env.CERT_B64 != ''
        shell: pwsh
        run: |
          $certBytes = [Convert]::FromBase64String("$env:CERT_B64")
          $certPath  = "$env:RUNNER_TEMP\sumerian-sign.pfx"
          [IO.File]::WriteAllBytes($certPath, $certBytes)
          $signtool  = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits" `
                          -Filter "signtool.exe" -Recurse -ErrorAction SilentlyContinue |
                          Select-Object -First 1).FullName
          if (-not $signtool) { Write-Error "signtool.exe not found"; exit 1 }
          & $signtool sign `
            /fd SHA256 `
            /tr http://timestamp.digicert.com `
            /td SHA256 `
            /f $certPath `
            /p "$env:CERT_PASS" `
            "target\x86_64-pc-windows-msvc\release\sumerian.exe"
          Remove-Item $certPath -Force

      - name: Rename exe
        run: cp target/x86_64-pc-windows-msvc/release/sumerian.exe sumerian-windows-x64.exe

      - name: Install cargo-wix
        run: cargo install cargo-wix --locked

      - name: Build MSI
        run: |
          cargo wix init --force
          cargo wix --target x86_64-pc-windows-msvc --nocapture --output sumerian-windows-x64.msi

      - name: Install NSIS
        run: |
          choco install nsis -y
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build NSIS installer
        run: |
          @"
          OutFile "sumerian-windows-x64-setup.exe"
          InstallDir "\$PROGRAMFILES64\Sumerian"
          Page directory
          Page instfiles
          Section
            SetOutPath "\$INSTDIR"
            File "target\x86_64-pc-windows-msvc\release\sumerian.exe"
            CreateShortcut "\$SMPROGRAMS\Sumerian.lnk" "\$INSTDIR\sumerian.exe"
            WriteUninstaller "\$INSTDIR\uninstall.exe"
          SectionEnd
          Section "Uninstall"
            Delete "\$INSTDIR\sumerian.exe"
            Delete "\$INSTDIR\uninstall.exe"
            Delete "\$SMPROGRAMS\Sumerian.lnk"
            RMDir "\$INSTDIR"
          SectionEnd
          "@ | Out-File -Encoding ASCII installer.nsi
          makensis installer.nsi

      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sumerian-windows-x64.exe
            sumerian-windows-x64.msi
            sumerian-windows-x64-setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

  # ---------------------------------------------------------------------
  # WINDOWS ARM64 — exe + NSIS installer
  # (cargo-wix/WiX toolset does not reliably cross-target arm64 MSIs,
  #  so ARM64 ships as raw exe + NSIS installer only)
  # ---------------------------------------------------------------------
  build-windows-arm64:
    needs: create-release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Build
        run: cargo build --release --target aarch64-pc-windows-msvc

      - name: Rename exe
        run: cp target/aarch64-pc-windows-msvc/release/sumerian.exe sumerian-windows-arm64.exe

      - name: Install NSIS
        run: |
          choco install nsis -y
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build NSIS installer
        run: |
          @"
          OutFile "sumerian-windows-arm64-setup.exe"
          InstallDir "\$PROGRAMFILES64\Sumerian"
          Page directory
          Page instfiles
          Section
            SetOutPath "\$INSTDIR"
            File "target\aarch64-pc-windows-msvc\release\sumerian.exe"
            CreateShortcut "\$SMPROGRAMS\Sumerian.lnk" "\$INSTDIR\sumerian.exe"
            WriteUninstaller "\$INSTDIR\uninstall.exe"
          SectionEnd
          Section "Uninstall"
            Delete "\$INSTDIR\sumerian.exe"
            Delete "\$INSTDIR\uninstall.exe"
            Delete "\$SMPROGRAMS\Sumerian.lnk"
            RMDir "\$INSTDIR"
          SectionEnd
          "@ | Out-File -Encoding ASCII installer.nsi
          makensis installer.nsi

      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sumerian-windows-arm64.exe
            sumerian-windows-arm64-setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

  # ---------------------------------------------------------------------
  # LINUX x86_64 — tar.gz, .deb, .rpm, AppImage
  # ---------------------------------------------------------------------
  build-linux-x64:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Package tar.gz
        run: |
          cp target/x86_64-unknown-linux-gnu/release/sumerian sumerian-linux-x64
          tar -czf sumerian-linux-x64.tar.gz sumerian-linux-x64

      - name: Package .deb
        run: |
          mkdir -p deb/usr/local/bin
          cp target/x86_64-unknown-linux-gnu/release/sumerian deb/usr/local/bin/sumerian
          mkdir -p deb/DEBIAN
          cat <<EOF > deb/DEBIAN/control
          Package: sumerian
          Version: ${GITHUB_REF_NAME#v}
          Architecture: amd64
          Maintainer: Sumerian Client
          Description: A Rust Minecraft launcher
          EOF
          dpkg-deb --build deb sumerian-linux-x64.deb

      - name: Package .rpm
        run: |
          sudo apt-get update && sudo apt-get install -y rpm
          mkdir -p rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          mkdir -p rpmbuild/BUILDROOT/sumerian-${GITHUB_REF_NAME#v}-1.x86_64/usr/local/bin
          cp target/x86_64-unknown-linux-gnu/release/sumerian rpmbuild/BUILDROOT/sumerian-${GITHUB_REF_NAME#v}-1.x86_64/usr/local/bin/sumerian
          cat <<EOF > rpmbuild/SPECS/sumerian.spec
          Name: sumerian
          Version: ${GITHUB_REF_NAME#v}
          Release: 1
          Summary: A Rust Minecraft launcher
          License: MIT
          BuildArch: x86_64

          %description
          A modern Rust Minecraft launcher.

          %files
          /usr/local/bin/sumerian
          EOF
          rpmbuild --define "_topdir $(pwd)/rpmbuild" -bb rpmbuild/SPECS/sumerian.spec --buildroot "$(pwd)/rpmbuild/BUILDROOT/sumerian-${GITHUB_REF_NAME#v}-1.x86_64"
          cp rpmbuild/RPMS/x86_64/*.rpm sumerian-linux-x64.rpm

      - name: Package AppImage
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          mkdir -p AppDir/usr/bin
          cp target/x86_64-unknown-linux-gnu/release/sumerian AppDir/usr/bin/sumerian
          cat <<EOF > AppDir/sumerian.desktop
          [Desktop Entry]
          Name=Sumerian
          Exec=sumerian
          Icon=sumerian
          Type=Application
          Categories=Game;
          EOF
          convert -size 256x256 xc:transparent AppDir/sumerian.png 2>/dev/null || touch AppDir/sumerian.png
          cat <<'EOF' > AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "${HERE}/usr/bin/sumerian" "$@"
          EOF
          chmod +x AppDir/AppRun
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir sumerian-linux-x64.AppImage

      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sumerian-linux-x64
            sumerian-linux-x64.tar.gz
            sumerian-linux-x64.deb
            sumerian-linux-x64.rpm
            sumerian-linux-x64.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

  # ---------------------------------------------------------------------
  # LINUX ARM64 — tar.gz, .deb, .rpm, AppImage (cross-compiled)
  # ---------------------------------------------------------------------
  build-linux-arm64:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install cross-compilation toolchain and OpenSSL
        run: |
          # The default Azure mirror only carries amd64 packages, so arm64 lookups
          # return 404. Restrict the existing sources to [arch=amd64] and add a
          # separate ports.ubuntu.com entry for arm64 before enabling the arm64
          # architecture so that apt-get update succeeds.
          sudo sed -i 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list
          printf 'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble main restricted universe multiverse\n' \
            | sudo tee /etc/apt/sources.list.d/arm64-ports.list
          printf 'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-updates main restricted universe multiverse\n' \
            | sudo tee -a /etc/apt/sources.list.d/arm64-ports.list
          printf 'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-security main restricted universe multiverse\n' \
            | sudo tee -a /etc/apt/sources.list.d/arm64-ports.list
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libssl-dev:arm64 pkg-config

      - name: Configure linker and OpenSSL env for aarch64
        run: |
          mkdir -p .cargo
          cat <<EOF >> .cargo/config.toml
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig" >> $GITHUB_ENV
          echo "OPENSSL_DIR=/usr" >> $GITHUB_ENV
          echo "OPENSSL_LIB_DIR=/usr/lib/aarch64-linux-gnu" >> $GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=/usr/include" >> $GITHUB_ENV

      - name: Build
        run: cargo build --release --target aarch64-unknown-linux-gnu

      - name: Package tar.gz
        run: |
          cp target/aarch64-unknown-linux-gnu/release/sumerian sumerian-linux-arm64
          tar -czf sumerian-linux-arm64.tar.gz sumerian-linux-arm64

      - name: Package .deb
        run: |
          mkdir -p deb/usr/local/bin
          cp target/aarch64-unknown-linux-gnu/release/sumerian deb/usr/local/bin/sumerian
          mkdir -p deb/DEBIAN
          cat <<EOF > deb/DEBIAN/control
          Package: sumerian
          Version: ${GITHUB_REF_NAME#v}
          Architecture: arm64
          Maintainer: Sumerian Client
          Description: A Rust Minecraft launcher
          EOF
          dpkg-deb --build deb sumerian-linux-arm64.deb

      - name: Package .rpm
        run: |
          sudo apt-get install -y rpm
          mkdir -p rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          mkdir -p rpmbuild/BUILDROOT/sumerian-${GITHUB_REF_NAME#v}-1.aarch64/usr/local/bin
          cp target/aarch64-unknown-linux-gnu/release/sumerian rpmbuild/BUILDROOT/sumerian-${GITHUB_REF_NAME#v}-1.aarch64/usr/local/bin/sumerian
          cat <<EOF > rpmbuild/SPECS/sumerian.spec
          Name: sumerian
          Version: ${GITHUB_REF_NAME#v}
          Release: 1
          Summary: A Rust Minecraft launcher
          License: MIT
          BuildArch: aarch64

          %description
          A modern Rust Minecraft launcher.

          %files
          /usr/local/bin/sumerian
          EOF
          rpmbuild --define "_topdir $(pwd)/rpmbuild" --target aarch64 -bb rpmbuild/SPECS/sumerian.spec --buildroot "$(pwd)/rpmbuild/BUILDROOT/sumerian-${GITHUB_REF_NAME#v}-1.aarch64"
          cp rpmbuild/RPMS/aarch64/*.rpm sumerian-linux-arm64.rpm

      - name: Package AppImage
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          mkdir -p AppDir/usr/bin
          cp target/aarch64-unknown-linux-gnu/release/sumerian AppDir/usr/bin/sumerian
          cat <<EOF > AppDir/sumerian.desktop
          [Desktop Entry]
          Name=Sumerian
          Exec=sumerian
          Icon=sumerian
          Type=Application
          Categories=Game;
          EOF
          convert -size 256x256 xc:transparent AppDir/sumerian.png 2>/dev/null || touch AppDir/sumerian.png
          cat <<'EOF' > AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "${HERE}/usr/bin/sumerian" "$@"
          EOF
          chmod +x AppDir/AppRun
          ARCH=aarch64 ./appimagetool --appimage-extract-and-run AppDir sumerian-linux-arm64.AppImage

      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sumerian-linux-arm64
            sumerian-linux-arm64.tar.gz
            sumerian-linux-arm64.deb
            sumerian-linux-arm64.rpm
            sumerian-linux-arm64.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

  # ---------------------------------------------------------------------
  # LINUX FLATPAK (built from the x86_64 build output)
  # ---------------------------------------------------------------------
  build-linux-flatpak:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Install flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.freedesktop.Platform//23.08 org.freedesktop.Sdk//23.08

      - name: Assemble flatpak manifest
        run: |
          mkdir -p flatpak-build
          cp target/x86_64-unknown-linux-gnu/release/sumerian flatpak-build/sumerian
          cat <<EOF > flatpak-build/com.sumerianmc.sumerian.yml
          app-id: com.sumerianmc.sumerian
          runtime: org.freedesktop.Platform
          runtime-version: '23.08'
          sdk: org.freedesktop.Sdk
          command: sumerian
          finish-args:
            - --share=network
            - --share=ipc
            - --socket=x11
            - --socket=wayland
            - --device=dri
            - --filesystem=home
          modules:
            - name: sumerian
              buildsystem: simple
              build-commands:
                - install -Dm755 sumerian /app/bin/sumerian
              sources:
                - type: file
                  path: sumerian
          EOF

      - name: Build flatpak
        run: |
          cd flatpak-build
          flatpak-builder --force-clean --repo=repo build com.sumerianmc.sumerian.yml
          flatpak build-bundle repo ../sumerian-linux-x64.flatpak com.sumerianmc.sumerian

      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          files: sumerian-linux-x64.flatpak
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

  # ---------------------------------------------------------------------
  # MACOS INTEL (x86_64)
  # ---------------------------------------------------------------------
  build-macos-intel:
    needs: create-release
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Build
        run: cargo build --release --target x86_64-apple-darwin

      - name: Package .app
        run: |
          mkdir -p Sumerian-intel.app/Contents/MacOS
          cp target/x86_64-apple-darwin/release/sumerian Sumerian-intel.app/Contents/MacOS/sumerian
          cat <<EOF > Sumerian-intel.app/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Sumerian</string>
            <key>CFBundleExecutable</key><string>sumerian</string>
            <key>CFBundleIdentifier</key><string>com.sumerianmc.sumerian</string>
            <key>CFBundleVersion</key><string>${{ github.ref_name }}</string>
            <key>CFBundlePackageType</key><string>APPL</string>
          </dict>
          </plist>
          EOF

      - name: Package .dmg
        run: |
          cp target/x86_64-apple-darwin/release/sumerian sumerian-macos-intel
          hdiutil create -volname Sumerian -srcfolder Sumerian-intel.app -ov -format UDZO sumerian-macos-intel.dmg

      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sumerian-macos-intel
            sumerian-macos-intel.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

  # ---------------------------------------------------------------------
  # MACOS ARM64 (native Apple Silicon)
  # ---------------------------------------------------------------------
  build-macos-arm:
    needs: create-release
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Build
        run: cargo build --release --target aarch64-apple-darwin

      - name: Package .app
        run: |
          mkdir -p Sumerian-arm64.app/Contents/MacOS
          cp target/aarch64-apple-darwin/release/sumerian Sumerian-arm64.app/Contents/MacOS/sumerian
          cat <<EOF > Sumerian-arm64.app/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Sumerian</string>
            <key>CFBundleExecutable</key><string>sumerian</string>
            <key>CFBundleIdentifier</key><string>com.sumerianmc.sumerian</string>
            <key>CFBundleVersion</key><string>${{ github.ref_name }}</string>
            <key>CFBundlePackageType</key><string>APPL</string>
          </dict>
          </plist>
          EOF

      - name: Package .dmg
        run: |
          cp target/aarch64-apple-darwin/release/sumerian sumerian-macos-arm64
          hdiutil create -volname Sumerian -srcfolder Sumerian-arm64.app -ov -format UDZO sumerian-macos-arm64.dmg

      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sumerian-macos-arm64
            sumerian-macos-arm64.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

  # ---------------------------------------------------------------------
  # MACOS UNIVERSAL BINARY (Intel + Apple Silicon combined via lipo)
  # ---------------------------------------------------------------------
  build-macos-universal:
    needs: create-release
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Build both architectures
        run: |
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin

      - name: Create universal binary with lipo
        run: |
          lipo -create \
            target/x86_64-apple-darwin/release/sumerian \
            target/aarch64-apple-darwin/release/sumerian \
            -output sumerian-universal
          lipo -info sumerian-universal

      - name: Package .app
        run: |
          mkdir -p Sumerian.app/Contents/MacOS
          cp sumerian-universal Sumerian.app/Contents/MacOS/sumerian
          cat <<EOF > Sumerian.app/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Sumerian</string>
            <key>CFBundleExecutable</key><string>sumerian</string>
            <key>CFBundleIdentifier</key><string>com.sumerianmc.sumerian</string>
            <key>CFBundleVersion</key><string>${{ github.ref_name }}</string>
            <key>CFBundlePackageType</key><string>APPL</string>
          </dict>
          </plist>
          EOF

      - name: Package .dmg
        run: |
          cp sumerian-universal sumerian-macos-universal
          hdiutil create -volname Sumerian -srcfolder Sumerian.app -ov -format UDZO sumerian-macos-universal.dmg

      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sumerian-macos-universal
            sumerian-macos-universal.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

  # ---------------------------------------------------------------------
  # RELEASE NOTES — runs git-cliff against the tag to generate a
  # structured changelog from conventional commits and updates the
  # GitHub release body automatically.
  # ---------------------------------------------------------------------
  release-notes:
    needs:
      - build-windows-x64
      - build-windows-arm64
      - build-linux-x64
      - build-linux-arm64
      - build-linux-flatpak
      - build-macos-intel
      - build-macos-arm
      - build-macos-universal
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history required by git-cliff

      - name: Install git-cliff
        uses: kenji-miyake/setup-git-cliff@v2

      - name: Generate release notes
        id: cliff
        run: |
          git-cliff --config cliff.toml --latest --strip header \
            --output RELEASE_NOTES.md
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          cat RELEASE_NOTES.md >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Update release body
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.cliff.outputs.body }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

  # ---------------------------------------------------------------------
  # SIGNED ARTIFACTS — uses Sigstore cosign to sign every release asset
  # and upload detached .sig files so users can verify provenance without
  # a private key (keyless OIDC signing via GitHub Actions).
  # ---------------------------------------------------------------------
  sign-artifacts:
    needs:
      - build-windows-x64
      - build-windows-arm64
      - build-linux-x64
      - build-linux-arm64
      - build-linux-flatpak
      - build-macos-intel
      - build-macos-arm
      - build-macos-universal
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write   # required for keyless OIDC signing
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Download all release assets
        run: |
          mkdir -p to-sign
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir to-sign \
            --skip-existing
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Sign assets with cosign (keyless)
        run: |
          cd to-sign
          for f in *; do
            # Skip files we produced ourselves (.sig, .json, .txt)
            [[ "$f" == *.sig  ]] && continue
            [[ "$f" == *.json ]] && continue
            [[ "$f" == *.txt  ]] && continue
            echo "Signing $f ..."
            cosign sign-blob --yes "$f" \
              --bundle "${f}.cosign.bundle"
          done

      - name: Upload signatures
        uses: softprops/action-gh-release@v2
        with:
          files: to-sign/*.cosign.bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

  # ---------------------------------------------------------------------
  # CHECKSUMS — runs after every build job has uploaded its assets,
  # downloads everything from the release, hashes it, and uploads a
  # single SHA256SUMS.txt so users can verify their downloads.
  # ---------------------------------------------------------------------
  checksums:
    needs:
      - build-windows-x64
      - build-windows-arm64
      - build-linux-x64
      - build-linux-arm64
      - build-linux-flatpak
      - build-macos-intel
      - build-macos-arm
      - build-macos-universal
      - release-notes
      - sign-artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Download all release assets
        run: |
          mkdir -p release-assets
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir release-assets \
            --skip-existing
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Generate SHA256SUMS.txt
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload checksums
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

  # ---------------------------------------------------------------------
  # SBOM — generates a CycloneDX Software Bill of Materials from
  # Cargo.lock and attaches it to the release.  Consumers can use the
  # SBOM to audit dependency licenses and check for known CVEs.
  # ---------------------------------------------------------------------
  sbom:
    needs:
      - build-windows-x64
      - build-windows-arm64
      - build-linux-x64
      - build-linux-arm64
      - build-linux-flatpak
      - build-macos-intel
      - build-macos-arm
      - build-macos-universal
      - release-notes
      - sign-artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-sbom-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-sbom-

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked

      - name: Generate SBOM
        run: |
          cargo cyclonedx \
            --format json \
            --spec-version 1.5 \
            --all \
            --output-prefix sumerian-sbom
          # cargo-cyclonedx writes <prefix>_<package>.cdx.json; rename for clarity
          mv sumerian-sbom_sumerian-client.cdx.json sumerian-sbom.cdx.json 2>/dev/null || \
            mv sumerian-sbom*.cdx.json sumerian-sbom.cdx.json

      - name: Upload SBOM
        uses: softprops/action-gh-release@v2
        with:
          files: sumerian-sbom.cdx.json
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
