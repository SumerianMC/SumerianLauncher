# git-cliff configuration — generates CHANGELOG.md and GitHub release notes
# from conventional commits.  Reference: https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog\n
All notable changes to Sumerian Client are documented here.\n
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.breaking %}[**BREAKING**] {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
  { message = "^feat",     group = "Features"     },
  { message = "^fix",      group = "Bug Fixes"    },
  { message = "^perf",     group = "Performance"  },
  { message = "^refactor", group = "Refactor"     },
  { message = "^docs",     group = "Documentation"},
  { message = "^chore",    group = "Miscellaneous"},
  { message = "^ci",       group = "CI/CD"        },
  { message = "^test",     group = "Tests"        },
  { body = ".*security",   group = "Security"     },
]
filter_commits = false
tag_pattern = "v[0-9].*"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "oldest"
