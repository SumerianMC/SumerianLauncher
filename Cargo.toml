[package]
name = "sumerian-client"
version = "0.51.0"
edition = "2021"
description = "A modern Rust Minecraft legacy client that brings old Minecraft versions into the future with shaders, textures, and optimization."
authors = ["Sumerian Client"]

[[bin]]
name = "sumerian"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "stream", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
hex = "0.4"
anyhow = "1"
thiserror = "1"
futures-util = "0.3"
indicatif = "0.17"
dialoguer = "0.11"
console = "0.15"
dirs = "5"
zip = "0.6"
tokio-util = { version = "0.7", features = ["io"] }
open = "5"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v3", "v4"] }
base64 = "0.21"
url = "2"
discord-rich-presence = "1.1.0"
sysinfo = "0.30"
